experiment:
  id: cat-dog-balanced-mixed-pgd-pilot-v1
  title: Exploratory Balanced Clean-to-PGD Cat/Dog Pilot
  created_at: "2026-09-17T19:00:00+05:30"
  expected_python: "3.13.15"
  public_actions_authorized: false

paths:
  data: data
  weights: weights
  checkpoints: checkpoints
  artifacts: artifacts/pilots/balanced-mixed-pgd-v1
  results: results/generated/pilots/balanced-mixed-pgd-v1
  figures: figures/generated/pilots/balanced-mixed-pgd-v1
  reports: reports/generated/pilots/balanced-mixed-pgd-v1

dataset:
  name: Oxford-IIIT Pet
  expected_trainval: 3680
  expected_test: 3669
  label_mode: species
  classes: 2
  train_fraction: 0.8
  split_seed: oxford-pets-split-20260914
  attack_per_class: 100
  projection_per_class: 10  # Inert embedding-helper compatibility, not a pilot analysis.
  selection_seed: oxford-pets-selection-20260914

model:
  architecture: resnet18
  weights: IMAGENET1K_V1
  classes: 2
  feature_dim: 512
  initialization_seed: 20260915

input:
  size: 224
  eval_resize: 256
  train_crop_scale: [0.8, 1.0]
  horizontal_flip_probability: 0.5
  imagenet_mean: [0.485, 0.456, 0.406]
  imagenet_std: [0.229, 0.224, 0.225]

training:
  epochs: 15
  micro_batch_size: 16
  gradient_accumulation_steps: 2
  evaluation_batch_size: 16
  num_workers: 2
  backbone_learning_rate: 0.0001
  head_learning_rate: 0.001
  weight_decay: 0.0001
  warmup_epochs: 1  # LR warm-up; distinct from the three clean-only epochs below.
  data_seed: 20260916
  attack_seed: 20260917
  dtype: float32
  device: mps

pilot:
  enabled: true
  clean_warmup_epochs: 3
  clean_loss_weight: 0.5
  validation_fraction: 0.1
  validation_seed: pets-pilot-validation-20260917
  validation_attack_per_species: 32
  original_config: configs/experiment.yaml
  original_config_sha256: 3b96c26d328cffc308cb6de70e070748bba3c9fe7a7b229ccba6749f8aec2a91
  original_evaluation: results/generated/evaluation.json
  original_evaluation_sha256: 5a405fdff008137e9012062bcdbcb8c52d1caed128e84c5e3d4738fa13037b1c
  # Weights are N/(2*n_species), derived from the effective fitting samples only.
  # Fixed epoch 15 is evaluated regardless of validation history; no model selection.

attack:
  norm: linf
  epsilon: 0.01568627450980392
  train_steps: 5
  evaluation_steps: 20
  step_size: 0.00392156862745098
  random_start: true
  evaluation_restarts: 5
  evaluation_seed: 20260918

corruptions:
  gaussian_noise: [0.02, 0.05]
  gaussian_blur: [0.75, 1.5]
  brightness: [0.8, 0.6]
  contrast: [0.75, 0.5]

calibration:
  target_coverage: 0.9
  ece_bins: 15
  temperature_bounds: [0.05, 20.0]

# Inert legacy compatibility fields. The pilot runs no embedding analysis.
representations:
  neighbours: 5
  bootstrap_replicates: 2000
  bootstrap_seed: 20260919
  projection_seed: 20260920
  tsne_perplexity: 30
  tsne_learning_rate: auto
  tsne_iterations: 1500
  umap_neighbours: 15
  umap_min_distance: 0.1
  umap_metric: cosine

preflight:
  parity_atol: 0.0001
  parity_rtol: 0.0001
