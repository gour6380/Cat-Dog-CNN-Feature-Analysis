[project]
name = "oxford-pets-adversarial-representations"
version = "0.2.0"
description = "Learned CNN features and prediction influence in standard and PGD-trained cat/dog models"
readme = "README.md"
license = "MIT"
authors = [{ name = "Gourav Karwasara" }]
keywords = [
  "adversarial-training",
  "apple-silicon",
  "cnn-interpretability",
  "computer-vision",
  "pytorch",
]
requires-python = "==3.13.15"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.ipynb" = ["E402"]
"scripts/build_notebook.py" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
ignore_missing_imports = true
exclude = [".venv", "data", "artifacts", "results"]
