[project]
name = "oxford-pets-adversarial-representations"
version = "0.1.0"
description = "Matched ResNet-18 study of adversarial representation drift in Oxford-IIIT Pet"
requires-python = "==3.13.15"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
ignore_missing_imports = true
exclude = [".venv", "data", "artifacts", "results"]
